name: Teedy CI Build

on:
  push:
    branches: [ "master" ] # 根据你的实际分支名调整
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # 👇 关键步骤：显式设置 JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin' # 推荐使用 Temurin (Eclipse Adoptium)

      # 👇 可选：缓存 Maven 依赖以加速构建
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 👇 执行 Maven 编译和打包
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 👇 可选：上传构建产物（如 WAR/JAR 包）
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: teedy-build-output
          path: target/*.war # 根据你项目的实际输出文件名调整
