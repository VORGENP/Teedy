name: Teedy CI Build # 流水线的名字，显示在 Actions 页面上

on:
  push:
    branches: [ "main", "master" ] # 当推送到 main 或 master 分支时触发
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 提供的最新 Ubuntu 虚拟机

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 设置 Java 环境 (Teedy 通常需要 Java 8)
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      # 3. 缓存 Maven 依赖 (为了加快速度，可选)
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 4. 执行构建 (这就是你在 Jenkins 里跑的那行命令)
      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      # 5. 验证产物 (对应你之前截图里的步骤)
      - name: Check WAR file
        run: |
          echo "Checking if WAR file exists..."
          ls -l docs-web/target/*.war
